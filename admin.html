<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin | AirMilesHK Marketplace</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,600;1,400&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/market.css">
<link rel="icon" type="image/png" href="assets/favicon.png">
</head><body>
<div id="hk-header"></div>
<main>
<section class="page-hero"><div class="W">
  <div class="ey">Admin</div>
  <h1>Marketplace <em>overview</em></h1>
  <p class="hs">All members, listings and deals. Agreed deals need you to arrange payment and delivery.</p>
</div></section>
<section class="sec"><div class="W">
  <div class="actions mb"><button class="btn" type="button" id="new-ad-btn">+ Create ad</button></div>
  <form id="ad-form" class="form-card mb hide" novalidate style="max-width:820px">
    <h3>Create an ad</h3>
    <p style="font-size:.85rem">Goes live straight away as "Listed via AirMilesHK". Bids come to you. No account or emails needed.</p>
    <div class="f-row">
      <div class="f-field"><label class="f-label" for="ad-prog">Programme</label><select class="f-select" id="ad-prog"></select></div>
      <div class="f-field"><label class="f-label" for="ad-bal">Balance</label><input class="f-input" id="ad-bal" inputmode="numeric" placeholder="e.g. 250k"></div>
    </div>
    <div class="f-row hide" id="ad-other-row">
      <div class="f-field"><label class="f-label" for="ad-other">Programme name</label><input class="f-input" id="ad-other" maxlength="80"></div>
      <div class="f-field"><label class="f-label" for="ad-ptype">Type</label><select class="f-select" id="ad-ptype"><option value="airline">Airline miles</option><option value="hotel">Hotel points</option><option value="bank">Card points</option><option value="other">Other</option></select></div>
    </div>
    <span class="f-label">How it's sold</span>
    <div class="actions mb">
      <label class="pill-toggle"><input type="checkbox" id="ad-partial" checked> Partial</label>
      <input class="f-input" id="ad-min" inputmode="numeric" placeholder="Min per deal (optional)" style="max-width:200px;padding:7px 12px">
      <label class="pill-toggle"><input type="checkbox" id="ad-whole"> Whole account</label>
      <label class="pill-toggle"><input type="checkbox" id="ad-book"> Issues tickets / books stays</label>
    </div>
    <div class="f-row">
      <div class="f-field"><label class="f-label" for="ad-mode">Price</label><select class="f-select" id="ad-mode"><option value="offers">Open to offers</option><option value="fixed">Asking price</option></select></div>
      <div class="f-field"><label class="f-label" for="ad-elite">Elite status (optional)</label><input class="f-input" id="ad-elite" maxlength="80"></div>
    </div>
    <div class="f-row hide" id="ad-price-row">
      <div class="f-field"><label class="f-label" for="ad-cpp">US¢ per mile/point</label><input class="f-input" id="ad-cpp" inputmode="decimal" placeholder="e.g. 1.25"></div>
      <div class="f-field"><label class="f-label" for="ad-wp">Whole-account price (US$)</label><input class="f-input" id="ad-wp" inputmode="decimal"></div>
    </div>
    <div class="f-field"><label class="f-label" for="ad-notes">Public notes (optional)</label><textarea class="f-text" id="ad-notes" maxlength="2000" style="min-height:64px"></textarea></div>
    <div class="note mb" style="background:var(--page)"><strong>Private, only you see these</strong> (optional)
      <div class="f-row mt"><div class="f-field" style="margin:0"><label class="f-label" for="ad-sname">Real seller name</label><input class="f-input" id="ad-sname" maxlength="120"></div>
      <div class="f-field" style="margin:0"><label class="f-label" for="ad-sphone">Seller phone / WhatsApp</label><input class="f-input" id="ad-sphone" maxlength="40" placeholder="+852 …"></div></div></div>
    <div id="ad-msg"></div>
    <div class="actions"><button class="btn" type="submit" id="ad-save">Publish ad</button><button class="btn ol" type="button" id="ad-close">Close</button>
      <label class="pill-toggle" style="margin-left:auto"><input type="checkbox" id="ad-keep" checked> Keep details for the next ad</label></div>
  </form>
  <div class="stats" id="stats"></div>
  <div class="tabs" role="tablist" id="tabs">
    <button role="tab" data-tab="deals" aria-selected="true">Deals <span class="count" id="c-deals"></span></button>
    <button role="tab" data-tab="activity" aria-selected="false">Activity · WhatsApp <span class="count" id="c-activity"></span></button>
    <button role="tab" data-tab="quotes" aria-selected="false">Quote requests <span class="count" id="c-quotes"></span></button>
    <button role="tab" data-tab="listings" aria-selected="false">Listings <span class="count" id="c-listings"></span></button>
    <button role="tab" data-tab="members" aria-selected="false">Members <span class="count" id="c-members"></span></button>
  </div>
  <div class="actions mb"><input class="f-input" id="search" placeholder="Search name, email, programme…" style="max-width:340px">
    <select class="f-select" id="status-filter" style="max-width:220px"></select>
    <button class="btn ol sm" id="csv">Download CSV</button></div>
  <div class="tbl-wrap"><table class="tbl" id="tbl"><thead></thead><tbody><tr><td class="loading">Loading…</td></tr></tbody></table></div>
</div></section>
</main>
<div id="hk-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="assets/js/config.js"></script><script src="assets/js/api.js"></script><script src="assets/js/app.js"></script>
<script src="assets/js/page-admin.js"></script>
</body></html>
